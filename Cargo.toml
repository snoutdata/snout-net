# Its own workspace, not a member of packages/stack's (whose Cargo.toml excludes it): a Postgres
# extension is built with pgrx against a Postgres's headers, in its own container
# (container/Containerfile), and pgrx pins its own dependency tree exactly. Its own lockfile, the
# same toolchain. It links the system's libcurl (src/curl.rs), which the database server's
# distribution already carries.
[workspace]

[package]
name = "snout_net"
description = "snout_net: asynchronous HTTP requests from SQL, sent by a background worker."
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/snoutdata/snout-net"
rust-version = "1.98.1"
publish = false

[lib]
crate-type = ["cdylib", "lib"]

[features]
default = ["pg17"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

# Pinned exactly, as snout_utils' is.
[dependencies]
pgrx = "=0.19.2"
libc = "0.2"

[dev-dependencies]
pgrx-tests = "=0.19.2"

[lints.rust]
# X13: `unsafe` is denied everywhere except the Postgres and libcurl boundaries. This crate IS
# that boundary (a background worker, shared memory, C entry points, libcurl's callbacks), so it is
# allowed here and confined: the pure logic (egress.rs, request.rs) forbids it in its own module.
unsafe_code = "allow"
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(pgrx_embed)'] }

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

# pgrx turns a Postgres ERROR into a Rust panic and back again, so a panic must unwind.
[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
codegen-units = 1
# Not stripped here: scripts/build-dist.sh strips the shipped copy and keeps the symbols apart.
